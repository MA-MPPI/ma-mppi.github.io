<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Anonymous supplementary video for MA-MPPI.">
  <title>MA-MPPI | Anonymous Supplementary Video</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 72rem);
      padding: clamp(1.25rem, 4vw, 3rem);
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #e1e7f0;
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgb(23 32 51 / 8%);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      letter-spacing: -0.02em;
    }

    p {
      margin: 0.6rem 0 1.5rem;
      color: #536079;
    }

    .group {
      margin-top: 2rem;
    }

    .group h2 {
      margin: 0 0 1rem;
      font-size: 1.35rem;
      color: #263451;
    }

    .videos {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    figure {
      margin: 0;
      padding: 0.75rem;
      border: 1px solid #e1e7f0;
      border-radius: 0.75rem;
      background: #fbfcff;
    }

    figcaption {
      margin: 0.7rem 0 0;
      color: #263451;
      font-weight: 600;
      text-align: center;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      background: #0b1020;
      border-radius: 0.65rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>MA-MPPI</h1>
    <p>Anonymous supplementary videos</p>

    <section class="group" aria-labelledby="clutter1-title">
      <h2 id="clutter1-title">Clutter 1</h2>
      <div class="videos">
      <figure>
        <video controls preload="metadata">
          <source src="video_1.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
        <figcaption>a</figcaption>
      </figure>
      <figure>
        <video controls preload="metadata">
          <source src="video_2.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
        <figcaption>b</figcaption>
      </figure>
      <figure>
        <video controls preload="metadata">
          <source src="video_3.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
        <figcaption>c</figcaption>
      </figure>
      </div>
    </section>

    <section class="group" aria-labelledby="clutter2-title">
      <h2 id="clutter2-title">Clutter 2</h2>
      <div class="videos">
      <figure>
        <video controls preload="metadata">
          <source src="video_4.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
        <figcaption>a</figcaption>
      </figure>
      <figure>
        <video controls preload="metadata">
          <source src="video_5.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
        <figcaption>b</figcaption>
      </figure>
      <figure>
        <video controls preload="metadata">
          <source src="video_6.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
        <figcaption>c</figcaption>
      </figure>
      </div>
    </section>
  </main>
</body>
</html>
